# ============================================================================
# ZAI FLOW 2.0 - Root Netlify Configuration
# Configures: Static site (frontend), Serverless Functions, and Routing
# ============================================================================

[build]
  command = ""

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# Set these in Netlify UI under Settings > Build & deploy > Environment
# - SUPABASE_URL: Your Supabase project URL
# - SUPABASE_ANON_KEY: Your Supabase public/anon key (rotate periodically)
# - JWT_SECRET: Strong random secret (min 32 chars)
# - DATABASE_URL: PostgreSQL connection string
#
# SECURITY: Never commit actual values to this file.
# Secret scanning is ENABLED for this repository (no omits).
[build.environment]
  PUBLISH_DIR = "frontend"

# ============================================================================
# SERVERLESS FUNCTIONS
# ============================================================================
[functions]
  directory = "netlify/functions"

# ============================================================================
# SPA ROUTING - Serve HTML files directly, fallback to login for API-like routes
# ============================================================================
# HTML files should be served directly
[[redirects]]
  from = "/:page.html"
  to = "/:page.html"
  status = 200
  force = true

# Assets and static files
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200
  force = true

# For non-HTML routes, redirect to login (SPA entry point)
[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 200

# ============================================================================
# HEADERS - Security and Performance
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"
    # Prevent clickjacking attacks
    X-Frame-Options = "SAMEORIGIN"
    # Enable XSS filter (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for 1 year (HSTS) - critical for production
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Restrict browser features (defense in depth)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy - allows Supabase + self-hosted resources
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'self';"
    # Disable caching for HTML (forces fresh content)
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
